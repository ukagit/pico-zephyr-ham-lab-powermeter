<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HamLab A2 kompakt</title>
<style>body{background:#101820;color:#edf4f8;font:16px system-ui;max-width:560px;margin:auto;padding:12px}h1{font-size:16px;font-weight:500;margin:0}header{margin-bottom:10px}small,#status,.note{font-size:12px;color:#bfcedb}article{background:#203040;border-radius:14px;padding:16px}article h2,article>p:not(.note),#a2reset{display:none}.watts{font-size:56px;line-height:1.2;margin-bottom:12px}.meter{position:relative;height:32px;background:#101820;border:1px solid #708596;border-radius:7px;overflow:hidden;cursor:pointer}.fill{height:100%;width:0;transition:width .1s}.hold{position:absolute;top:0;bottom:0;width:4px;background:#ffd166;transform:translateX(-100%);display:none}.ticks{display:flex;justify-content:space-between;font-size:12px;color:#bfcedb;margin-top:6px}.note{margin:8px 0 0}article>p.a2-peak{display:block;font-size:13px;color:#ffd166;margin:8px 0 0}footer{font-size:12px;margin-top:12px}a{color:#77e1bc}</style></head>
<body><header><h1>HamLab · A2-Messkopf</h1><small><span id="version"></span> · © DL2DBG</small><div id="status">Verbinden …</div></header>
<article><h2>A2 · Gleichspannungs-Voltmeter</h2><div class="watts" id="a2voltage" style="color:#64b5ff">-- V</div><div class="meter" role="meter" id="a2vbar" aria-label="A2 Gleichspannung, direkt am ADC"><div class="fill" id="a2vfill" style="background:#64b5ff"></div></div><div class="ticks"><span>0 V</span><span id="a2vscale">1 V</span></div><p class="note" id="a2vnote">Direkte Spannungsmessung · 1:1</p></article>
<article><h2>A2-Messkopf · Leistung an 50 Ω</h2><div class="watts" id="a2power" style="color:#64b5ff">--</div><div class="meter" id="a2bar" role="meter" aria-label="A2-Messkopf-Leistung"><div class="fill" id="a2fill" style="background:#64b5ff"></div><div class="hold" id="a2hold"></div></div><div class="ticks"><span>0</span><span id="a2tick25"></span><span id="a2tick50"></span><span id="a2tick75"></span><span id="a2tick100"></span></div><p>Autoscale: <strong id="a2scale">--</strong> · <span class="legend">Gelbe Marke: Max-Hold 3 s</span></p><p class="a2-peak">Max-Hold: <strong id="a2peak">--</strong></p><p class="note" id="a2dbm">-- dBm</p><p id="currentcoupler" class="note">A2-Messkopf: --</p><p id="a2quality" class="note"></p><button id="a2reset">Hold zurücksetzen</button></article>
<footer><a href="/">Vollansicht</a> · <a href="/compact">Kompakt A0</a></footer>
<script>
const el=id=>document.getElementById(id);
function drawA2Voltage(c){
 const overflow=!!(c?.voltage_overflow||c?.overrange||(c?.valid&&Number.isFinite(c.voltage_v)&&c.voltage_v>=3.2));
 const valid=!overflow&&c?.valid&&!c.overrange&&Number.isFinite(c.input_voltage_v);
 const v=valid?c.input_voltage_v:null;
 const scale=[0.1,0.2,0.5,1,2,3.3].find(n=>n>=Math.abs(v??0))??3.3;
 el('a2voltage').style.color=overflow?'#ff6b6b':'#64b5ff';
 el('a2voltage').textContent=overflow?'OVERFLOW':valid?v.toLocaleString('de-DE',{minimumFractionDigits:4,maximumFractionDigits:4})+' V':'-- V';
 el('a2vscale').textContent=scale.toLocaleString('de-DE')+' V';
 el('a2vfill').style.background=overflow?'#e53935':'#64b5ff';
 el('a2vfill').style.width=overflow?'100%':(Math.max(0,Math.min(v??0,scale))/scale*100)+'%';
 el('a2vbar').setAttribute('aria-valuemin',0);el('a2vbar').setAttribute('aria-valuemax',scale);
 if(valid)el('a2vbar').setAttribute('aria-valuenow',v);else el('a2vbar').removeAttribute('aria-valuenow');
 el('a2vbar').setAttribute('aria-valuetext',overflow?'Spannungsgrenze: Overflow':valid?v+' V':'Keine aktuelle Messung');
 el('a2vnote').style.color=overflow?'#ff6b6b':'';
 el('a2vnote').textContent=overflow?'Spannungsgrenze / Übersteuerung · ab 3,2 V am ADC · Eingangsspannung nicht bestimmbar':valid?'Gleichspannung direkt am ADC · '+c.voltage_v.toFixed(7)+' V × '+c.divider_ratio:c?.overrange?'ADC übersteuert':'Keine aktuelle Spannungsmessung';
}
let lastA2=null,lastA2Profile=null;
function drawA2(data,profile){
 lastA2=data;lastA2Profile=profile;
 const valid=data?.valid&&Number.isFinite(data.power_50ohm_w);
 const peak=Number.isFinite(data?.peak_w)?data.peak_w:null;
 const milli=Number.isFinite(data?.max_w)&&data.max_w<1;
 const factor=milli?1000:1,unit=milli?'mW':'W';
 const value=valid?data.power_50ohm_w*factor:null,held=peak===null?null:peak*factor;
 const levels=milli?[10,20,50,100,150,200,250,500,1000]:[10,20,50,100,150];
 const scale=levels.find(v=>v>=Math.max(value??0,held??0))??levels.at(-1);
 const fmt=v=>v.toLocaleString('de-DE',{maximumFractionDigits:milli?2:3})+' '+unit;
 el('a2power').textContent=valid?fmt(value):'-- '+unit;
 el('a2dbm').textContent=valid&&data.power_50ohm_w>0?(10*Math.log10(data.power_50ohm_w*1000)).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' dBm':'-- dBm';
 el('a2scale').textContent=fmt(scale);
 el('a2peak').textContent=held===null?'-- '+unit:fmt(held);
 el('a2fill').style.width=(Math.max(0,Math.min(value??0,scale))/scale*100)+'%';
 el('a2hold').style.display=held===null?'none':'block';
 el('a2hold').style.left=(Math.max(0,Math.min(held??0,scale))/scale*100)+'%';
 for(const n of [25,50,75,100])el('a2tick'+n).textContent=fmt(scale*n/100);
 el('a2bar').setAttribute('aria-valuemin',0);el('a2bar').setAttribute('aria-valuemax',scale);
 if(valid)el('a2bar').setAttribute('aria-valuenow',value);else el('a2bar').removeAttribute('aria-valuenow');
 el('a2bar').setAttribute('aria-valuetext',valid?fmt(value)+'; Max-Hold '+(held===null?'--':fmt(held)):'Keine gültige A2-Leistung');
 el('currentcoupler').textContent=data?'Profil '+(profile??'--')+' · Referenz '+data.master+' · '+(data.calibration_frequency_hz/1e6).toLocaleString('de-DE')+' MHz · 50 Ω':'A2-Messkopf: keine aktuellen Daten';
 el('a2quality').textContent=!data?'Keine Verbindung':valid?'Vorläufige Kennlinie · Messfrequenz nicht automatisch geprüft':data.quality==='outside_calibrated_range'?'A2 außerhalb der gemessenen Kennlinie · kein gültiger Leistungswert':'A2-Messung ungültig oder übersteuert';
}


async function poll(){const start=performance.now();try{
 const r=await fetch('/api/v1/state',{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error();const x=await r.json();if(!x.current_coupler)throw Error();
 drawA2Voltage(x.channels?.find(c=>c.input==='A2-A3'));drawA2(x.current_coupler,x.curve_profiles?.current);el('status').textContent='Verbunden';
}catch(e){drawA2Voltage(null);drawA2(null);el('status').textContent='Verbindung unterbrochen';}
setTimeout(poll,Math.max(20,200-(performance.now()-start)));}
el('a2reset').onclick=async()=>{try{const r=await fetch('/api/v1/peak/reset',{method:'POST',signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error();if(lastA2)drawA2({...lastA2,peak_w:null},lastA2Profile);}catch(e){el('status').textContent='Hold-Reset fehlgeschlagen';}};
el('a2bar').ondblclick=()=>el('a2reset').click();
el('a2bar').title='Doppelklick: Hold zurücksetzen';
fetch('/api/v1/info').then(r=>r.json()).then(x=>el('version').textContent='Firmware '+x.version).catch(()=>{});poll();
</script></body></html>
